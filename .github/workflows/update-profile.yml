name: Update Animated Profile

on:
  schedule:
    # Once daily: 05:23 UTC / 07:23 Rwanda time. Deliberately not every 6 hours and not at :00.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh live GitHub data and SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Ki-Will
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/update_profile.py

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ data/profile.json
          if git diff --cached --quiet; then
            echo "No profile changes."
          else
            git commit -m "chore: refresh animated profile"
            git push
          fi
